<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Contact With Jayanta</title>
    <link rel="stylesheet" href="style.css">
     <!-- Fav Icon -->
     <link rel="shortcut icon" href="/img/fav.png" type="image/x-icon">
</head>

<body>
    
    <section class="contact">
        <br>
    <br>
    <br>
    
        <h2>Contact Me!</h2>

        <form action="#">
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" placeholder="Full Name" id="name"class="item" autocomplete="off">
                    <div class="error-txt">Full Name Can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="text" placeholder="Email" id="email"class="item" autocomplete="off">
                    <div class="error-txt email">Email Can't be blank</div>
                </div>
            </div>

            <div class="input-box">
                <div class="input-field field">
                    <input type="text" placeholder="Subject" id="subject"class="item" autocomplete="off">
                    <div class="error-txt">Subject Can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="text" placeholder="Enter A Game Name " id="Game"class="item" autocomplete="off">
                    <div class="error-txt">Game Name Can't be blank</div>
                </div>
            </div>

            <div class="textarea-field field">
                <textarea name="" id="message" cols="30" rows="10" placeholder="Enter Your Message" class="item" autocomplete="off"></textarea>
                <div class="error-txt">Message Can't be blank</div>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <!-- Button -->
<br>

<br> 
<div>
      <a href="/projects/GameGlide/index.html"><button class="btn">Home</button></a>
</div>
<br>
<br>

    </section>

    <script src="script.js"></script>
</body>

</html>
